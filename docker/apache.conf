ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
KeepAlive On
KeepAliveTimeout 2

# Initial pilot sizing for the shared 1-vCPU VPS; tune after measuring load.
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    MaxRequestWorkers 4
    MaxConnectionsPerChild 500
</IfModule>

<VirtualHost *:8080>
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php
    ErrorLog /proc/self/fd/2
    # Do not log query strings, cookies, credentials or request payloads.
    LogFormat "%h %t \"%m %U %H\" %>s %b" pingofin
    CustomLog /proc/self/fd/1 pingofin

    <Directory /var/www/html/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <FilesMatch "(?i)^(?!index\.php$).*\.php$">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>
