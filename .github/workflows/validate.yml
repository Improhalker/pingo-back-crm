name: API Laravel
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4.11@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
        env:
          MYSQL_DATABASE: pingofin_test
          MYSQL_USER: pingofin
          MYSQL_PASSWORD: ci-disposable-only
          MYSQL_ROOT_PASSWORD: ci-root-disposable-only
          TZ: UTC
        ports: ["3307:3306"]
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:8.2.10@sha256:164c759a0c342ee69d08fc99219382b0fd682181465c0df2e0e6911f4c85d73c
        ports: ["6380:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_DATABASE: pingofin_test
      DB_USERNAME: pingofin
      DB_PASSWORD: ci-disposable-only
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6380
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: "8.5"
          extensions: bcmath, pdo_mysql, mbstring, curl, dom, xml
          tools: composer:2
          coverage: none
      - run: cp .env.testing.example .env.testing
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer check-platform-reqs
      - run: php artisan key:generate --env=testing
      - run: vendor/bin/pint --test
      - run: php artisan test
      - name: Worker Redis real
        run: |
          php artisan queue:work redis --queue=bootstrap-smoke --sleep=1 --tries=1 > /tmp/pingofin-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          php artisan infra:queue-smoke
